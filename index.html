<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi PT Indoworld</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel = "stylesheet" href = "style.css">

</head>
<body>

<div class="dashboard-header">
    <div class="container d-flex justify-content-between align-items-center">
        <h2 class="mb-0 fw-bold">Sistem Absensi PT Indoworld</h2>
        <div id="clock" class="text-white">00:00:00</div>
    </div>
</div>

<div class="container">
    <div class="row">
        <div class="col-lg-5 mb-4">
            <div class="card p-4 text-center">
                <div class="scan-area">
                    <img src="https://cdn-icons-png.flaticon.com/512/805/805193.png" width="100" class="mb-4" alt="RFID Icon">
                    <h4 class="text-secondary">Silahkan Tap Kartu Anda</h4>
                    <p class="text-muted small">Pastikan kursor tetap aktif di halaman ini</p>
                    
                    <input type="text" id="rfid-input" autofocus autocomplete="off">

                    <div id="loader" class="spinner-border text-primary my-3" role="status" style="display: none;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <div id="status-box" class="alert status-message w-100 mt-3" style="display: none;"></div>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card p-4">
                <h4 class="mb-4 border-bottom pb-2">Riwayat Absensi Hari Ini</h4>
                <div class="table-container">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Waktu</th>
                                <th>Nama</th>
                                <th>Departemen</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="footer mt-auto py-3 bg-dark text-white">
    <div class="container text-center">
        <span class="small">© 2026 Developed by <strong>Rizki</strong> | IT Support System</span>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
